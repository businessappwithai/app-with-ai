# Adds the chat assistant and a one-origin gateway to a generated application's own compose file.
#
#   docker compose -f docker-compose.yml -f assistant/deploy/docker-compose.chat.yml --profile chat up --build
#
# `bun assistant/scripts/install-into.ts .` (or ./scripts/install-into.ts from this repository)
# copies the service to ./assistant and writes the .env entries this file reads.
# Service names (backend, frontend, report, postgres) are the generated compose file's own.
# Everything is behind the `chat` profile: without it nothing here starts.

services:
  assistant:
    profiles: ["chat"]
    build:
      context: ./assistant
      args:
        CHAT_BASE_PATH: /chat
    restart: unless-stopped
    environment:
      PORT: "4200"
      CHAT_BASE_PATH: /chat
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4080}
      APP_API_URL: http://backend:4001
      APP_BASE_PATH: ""
      REPORT_URL: http://report:3000
      REPORT_BASE_PATH: /report
      # Quoted: the message after `:?` contains a colon, which unquoted YAML reads as a mapping.
      CHAT_BRIDGE_SECRET: "${CHAT_BRIDGE_SECRET:?CHAT_BRIDGE_SECRET is required (the generator writes one into .env; bun assistant/scripts/install-into.ts does too)}"
      CHAT_DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD:-app}@postgres:5432/chatdb
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000/v1}
      AI_API_KEY: ${AI_API_KEY:-local}
      AI_MODEL: ${AI_MODEL:-qwen3.6:27b-mlx}
      CHAT_SKILLS_DIR: /skills
      # Threads and memory are held in memory unless BUZZ_* and KEY_ENCRYPTION_KEY are all set.
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      DO_NOT_TRACK: "1"
    volumes:
      - ./assistant-skills:/skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4200"
    healthcheck:
      # 127.0.0.1, never localhost: busybox resolves localhost to ::1 first.
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:4200/chat/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Every product shares this secret; chat-only mode and the delegated reporting sign-in read it.
  backend:
    environment:
      CHAT_BRIDGE_SECRET: ${CHAT_BRIDGE_SECRET:-}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4080}

  report:
    environment:
      CHAT_BRIDGE_SECRET: ${CHAT_BRIDGE_SECRET:-}
      CHAT_EMBED: "1"
      CHAT_SWITCHES_URL: http://assistant:4200/chat/switches
      CHAT_URL: /chat/
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4080}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://localhost:4080}

  gateway:
    profiles: ["chat"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4080}:80"
    volumes:
      - ./assistant/deploy/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
