# One origin for a generated application with the chat assistant:
#   /        the application's front end (which proxies /api to its backend)
#   /chat/   the assistant (built for this prefix; the prefix is not stripped)
#   /report/ the reporting platform (built for this prefix)
# Upstreams are addressed through variables so a service that is not up yet answers 502
# instead of stopping nginx from starting.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 64m;

    location /chat/ {
        set $chat_upstream http://assistant:4200;
        proxy_pass $chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Set from the connection, never from the client: the assistant's rate limits trust it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /chat;
        # The conversation-events WebSocket needs the upgrade; ordinary requests send none.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location = /chat { return 301 /chat/; }

    location /report/ {
        set $report_upstream http://report:3000;
        proxy_pass $report_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /report;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
    location = /report { return 301 /report/; }

    location / {
        set $app_upstream http://frontend:4000;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
